<nav class="sticky top-0 z-30 border-b border-zinc-800 bg-[#09090b]/95 backdrop-blur-md">
  <div class="mx-auto flex h-14 w-full max-w-7xl items-center justify-between px-4 sm:px-6 lg:px-8">
    <div class="flex min-w-0 items-center gap-4 md:gap-6">
      <a routerLink="/" class="inline-flex shrink-0 items-center gap-2.5">
        <img src="assets/solarchain-logo.svg" alt="SolarChain" class="h-7 w-7 rounded" />
        <span class="text-sm font-semibold tracking-tight text-zinc-100 sm:text-base">SolarChain</span>
      </a>

      <div class="hidden items-center gap-5 md:flex">
        <a
          routerLink="/admin"
          routerLinkActive="border-b-2 border-amber-500 pb-[2px] text-zinc-100 font-medium"
          class="text-sm text-zinc-400 transition-colors duration-150 hover:text-zinc-100"
        >
          Admin
        </a>
        <a
          routerLink="/producer"
          routerLinkActive="border-b-2 border-amber-500 pb-[2px] text-zinc-100 font-medium"
          class="text-sm text-zinc-400 transition-colors duration-150 hover:text-zinc-100"
        >
          Producteur
        </a>
        <a
          *ngIf="isProducer$ | async"
          routerLink="/producer/profile"
          routerLinkActive="border-b-2 border-amber-500 pb-[2px] text-zinc-100 font-medium"
          class="text-sm text-zinc-400 transition-colors duration-150 hover:text-zinc-100"
        >
          Mon Profil
        </a>
        <a
          routerLink="/consumer"
          routerLinkActive="border-b-2 border-amber-500 pb-[2px] text-zinc-100 font-medium"
          class="text-sm text-zinc-400 transition-colors duration-150 hover:text-zinc-100"
        >
          Consommateur
        </a>
        <a
          routerLink="/history"
          routerLinkActive="border-b-2 border-amber-500 pb-[2px] text-zinc-100 font-medium"
          class="text-sm text-zinc-400 transition-colors duration-150 hover:text-zinc-100"
        >
          Historique
        </a>
        <a
          *ngIf="isConnected$ | async"
          routerLink="/certificates"
          routerLinkActive="border-b-2 border-amber-500 pb-[2px] text-zinc-100 font-medium"
          class="text-sm text-zinc-400 transition-colors duration-150 hover:text-zinc-100"
        >
          Certificats
        </a>
      </div>
    </div>

    <div class="flex items-center gap-2 sm:gap-3">
      <span *ngIf="isCorrectNetwork$ | async" class="inline-flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full bg-green-500"></span>
        <span class="text-xs text-zinc-400">Reseau OK</span>
      </span>

      <span *ngIf="(isCorrectNetwork$ | async) === false" class="inline-flex items-center gap-2">
        <span class="h-1.5 w-1.5 rounded-full bg-red-500"></span>
        <span class="text-xs text-red-400">Mauvais reseau</span>
      </span>

      <button
        *ngIf="(isCorrectNetwork$ | async) === false"
        class="btn-secondary px-3 py-2 text-xs"
        (click)="switchNetwork()"
      >
        Changer reseau
      </button>

      <div *ngIf="(account$ | async) as account" class="hidden items-center gap-2 rounded-md border border-zinc-700 bg-zinc-800 px-2.5 py-1.5 xl:flex">
        <span class="text-xs font-mono text-zinc-300">{{ account.slice(0, 6) }}...{{ account.slice(-4) }}</span>
        <span class="text-xs text-zinc-500">{{ formatBalance(web3Service.balance$.value) }} ETH</span>
      </div>

      <button *ngIf="isConnected$ | async" class="btn-danger px-3 py-2 text-xs" (click)="disconnect()">Deconnecter</button>

      <button *ngIf="!(isConnected$ | async)" class="btn-primary px-4 py-2 text-sm" (click)="connect()">Connecter MetaMask</button>
    </div>
  </div>
</nav>
